<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FreshNest Admin Login</title>

  <link rel="stylesheet" href="css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" 
    rel="stylesheet"
  >
</head>

<body class="customer-bg">

  <div class="login-page">
    <div class="login-card">

      <div class="login-logo">
        🍃 FreshNest
      </div>

      <h1>Admin Login</h1>

      <p>
        Login to manage products, customer orders and store operations.
      </p>

      <form class="login-form" id="loginForm">
        <input
          type="email"
          id="adminEmail"
          placeholder="Admin Email"
          required
        />

        <input
          type="password"
          id="adminPassword"
          placeholder="Password"
          required
        />

        <button type="submit">Login</button>
      </form>

      <a href="index.html" class="back-home">← Back to Website</a>

    </div>
  </div>

  <script src="js/login.js?v=21"></script>
</body>
</html>
